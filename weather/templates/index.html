<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Погода</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", sans-serif;
        }

        body {
            background: linear-gradient(135deg, #74b9ff, #0984e3);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 700px;
            text-align: center;
        }

        h1 {
            color: white;
            margin-bottom: 30px;
            font-size: 42px;
            font-weight: 600;
        }

        form {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 35px;
        }

        input {
            width: 75%;
            padding: 15px 20px;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            outline: none;
        }

        button {
            padding: 15px 25px;
            border: none;
            border-radius: 12px;
            background: #2d3436;
            color: white;
            font-size: 17px;
            cursor: pointer;
            transition: .3s;
        }

        button:hover {
            background: #000;
        }

        .weather-card {
            background: rgba(255,255,255,0.95);
            border-radius: 18px;
            padding: 35px;
            min-height: 260px;

            display: flex;
            justify-content: center;
            align-items: center;

            box-shadow: 0 10px 30px rgba(0,0,0,.2);
        }

        .placeholder {
            color: #888;
            font-size: 20px;
        }

        /* Когда появятся данные о погоде */

        .weather {
            width: 100%;
        }

        .city {
            font-size: 34px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .temp {
            font-size: 64px;
            color: #0984e3;
            margin-bottom: 10px;
        }

        .description {
            font-size: 24px;
            color: #555;
            margin-bottom: 25px;
        }

        .details {
            display: flex;
            justify-content: space-around;
            font-size: 18px;
            color: #444;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🌤️ Узнай погоду</h1>

    <form method="GET">
        <input
            type="text"
            name="city"
            placeholder="Введите название города..."
            required
        >

        <button type="submit">
            Найти
        </button>
    </form>

    <div class="weather-card">

        <!-- Пока ничего не найдено -->
        <div class="placeholder">
            Здесь появится информация о погоде
        </div>

        <!--
        Позже можно заменить на Django-шаблон:

        {% if weather %}

        <div class="weather">

            <div class="city">{{ weather.city }}</div>

            <div class="temp">
                {{ weather.temperature }}°C
            </div>

            <div class="description">
                {{ weather.description }}
            </div>

            <div class="details">
                <div>💧 {{ weather.humidity }}%</div>
                <div>💨 {{ weather.wind }} м/с</div>
            </div>

        </div>

        {% endif %}
        -->

    </div>

</div>

</body>
</html>
